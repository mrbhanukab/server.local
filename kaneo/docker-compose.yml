services:
  postgres:
    image: postgres:16-alpine
    container_name: kaneo-postgres
    env_file:
      - .env
    environment:
      - =/var/lib/postgresql/data/pgdata
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  kaneo:
    image: ghcr.io/usekaneo/kaneo:latest
    ports:
      - ${LAN_IP}:5173:5173
      - ${TAILSCALE_IP}:5173:5173
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
